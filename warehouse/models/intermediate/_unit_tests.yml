version: 2

# dbt unit tests: they run the *real* model SQL against fabricated inputs. That's
# the difference between testing the logic and testing a copy of the logic
# rewritten in Python — here, if someone edits `int_claim_economics.sql`, these
# tests see the edit.
#
# They cover the three things the brief calls tricky — the fee split, reversal
# handling and malformed-record classification — plus the one it names outright:
# *which* NADAC snapshot represents a claim's cost. That one is a modelling
# choice, not a formula, which is exactly why it needs tests: nothing about the
# SQL tells a reader that "as-of the fill date" was chosen over "latest
# available", but a test called `cost_uses_the_snapshot_in_force_on_the_fill_date`
# fails the moment someone changes it.

unit_tests:
  # ---------- fee split ----------

  - name: fee_split_flat_partner
    description: Flat cut in cents; the remainder stays with White Lodge.
    model: int_claim_economics
    given:
      - input: ref('stg_claims')
        rows:
          - {claim_id: "c1", pbm_fee_cents: 500, dq_reject_reason: null}
      - input: ref('int_claim_attribution')
        rows:
          - {claim_id: "c1", partner: "Kafka Rx"}
      - input: ref('stg_partners')
        rows:
          - {partner: "Kafka Rx", fee_model: "flat", flat_fee_cents: 100, fee_rate: null}
    expect:
      rows:
        - {claim_id: "c1", partner_fee_cents: 100, wls_net_fee_cents: 400, partner_fee_was_capped: false}

  - name: fee_split_percentage_partner
    description: >
      Proportional cut. Flink Rx keeps 80% — the rate arrives already normalised
      to 0-1 by stg_partners, so 80% of 500 is 400 to the partner.
    model: int_claim_economics
    given:
      - input: ref('stg_claims')
        rows:
          - {claim_id: "c2", pbm_fee_cents: 500, dq_reject_reason: null}
      - input: ref('int_claim_attribution')
        rows:
          - {claim_id: "c2", partner: "Flink Rx"}
      - input: ref('stg_partners')
        rows:
          - {partner: "Flink Rx", fee_model: "percentage", flat_fee_cents: null, fee_rate: 0.8}
    expect:
      rows:
        - {claim_id: "c2", partner_fee_cents: 400, wls_net_fee_cents: 100, partner_fee_was_capped: false}

  - name: fee_split_percentage_rounds_without_losing_cents
    description: >
      33% of 101 cents is 33.33. It rounds to 33, and the remainder (68) goes to
      White Lodge — the sum must still be 101. This is the invariant that stops
      money being created or destroyed by rounding.
    model: int_claim_economics
    given:
      - input: ref('stg_claims')
        rows:
          - {claim_id: "c3", pbm_fee_cents: 101, dq_reject_reason: null}
      - input: ref('int_claim_attribution')
        rows:
          - {claim_id: "c3", partner: "Odd Rx"}
      - input: ref('stg_partners')
        rows:
          - {partner: "Odd Rx", fee_model: "percentage", flat_fee_cents: null, fee_rate: 0.33}
    expect:
      rows:
        - {claim_id: "c3", partner_fee_cents: 33, wls_net_fee_cents: 68}

  - name: fee_split_caps_partner_at_collected_fee
    description: >
      The case that motivated the cap: a flat $1.00 fee against a $0.50 pbm_fee.
      The partner takes the 50 cents collected, White Lodge keeps zero (never
      negative), and the flag marks the row with the 50-cent contractual gap.
    model: int_claim_economics
    given:
      - input: ref('stg_claims')
        rows:
          - {claim_id: "c4", pbm_fee_cents: 50, dq_reject_reason: null}
      - input: ref('int_claim_attribution')
        rows:
          - {claim_id: "c4", partner: "Kafka Rx"}
      - input: ref('stg_partners')
        rows:
          - {partner: "Kafka Rx", fee_model: "flat", flat_fee_cents: 100, fee_rate: null}
    expect:
      rows:
        - {claim_id: "c4", partner_fee_cents: 50, wls_net_fee_cents: 0,
           partner_fee_was_capped: true, capped_shortfall_cents: 50}

  - name: fee_split_direct_claim_keeps_whole_fee
    description: >
      A claim that arrived with no lookup has no partner to pay out to. White
      Lodge keeps the entire fee, and the row shows up as `direct` — it doesn't
      vanish from the report.
    model: int_claim_economics
    given:
      - input: ref('stg_claims')
        rows:
          - {claim_id: "c5", pbm_fee_cents: 700, dq_reject_reason: null}
      - input: ref('int_claim_attribution')
        rows: []
      - input: ref('stg_partners')
        rows: []
    expect:
      rows:
        - {claim_id: "c5", partner: "direct", partner_fee_cents: 0, wls_net_fee_cents: 700}

  - name: fee_split_zero_fee_partner_is_not_missing_data
    description: >
      Airflow Rx has `fee_cents = 0` — a zero-commission partner, not a partner
      with no terms. A naive coalesce would treat the zero as absent and fall
      through to the wrong rule. Here the payout is 0 and the model stays 'flat'.
    model: int_claim_economics
    given:
      - input: ref('stg_claims')
        rows:
          - {claim_id: "c6", pbm_fee_cents: 700, dq_reject_reason: null}
      - input: ref('int_claim_attribution')
        rows:
          - {claim_id: "c6", partner: "Airflow Rx"}
      - input: ref('stg_partners')
        rows:
          - {partner: "Airflow Rx", fee_model: "flat", flat_fee_cents: 0, fee_rate: null}
    expect:
      rows:
        - {claim_id: "c6", partner: "Airflow Rx", fee_model: "flat",
           partner_fee_cents: 0, wls_net_fee_cents: 700}

  - name: fee_split_ignores_quarantined_claims
    description: >
      A quarantined claim never enters the money calculation. If it did, an
      unknown NPI or a negative price would show up in revenue.
    model: int_claim_economics
    given:
      - input: ref('stg_claims')
        rows:
          - {claim_id: "ok",  pbm_fee_cents: 300, dq_reject_reason: null}
          - {claim_id: "bad", pbm_fee_cents: 300, dq_reject_reason: "unknown_npi"}
      - input: ref('int_claim_attribution')
        rows: []
      - input: ref('stg_partners')
        rows: []
    expect:
      rows:
        - {claim_id: "ok", partner: "direct", partner_fee_cents: 0, wls_net_fee_cents: 300}

  # ---------- reversals ----------

  - name: revert_keeps_earliest_when_claim_reverted_twice
    description: >
      The tie-break for a claim reverted twice: the first reversal is the one
      that invalidated the fill, the second is producer noise, so the earliest
      wins and `revert_event_count` preserves the fact that there were two.
      No claim in the sample reaches this model with two reverts — the 26
      duplicate revert ids are quarantined in staging — which is exactly why the
      rule is pinned here with fabricated rows instead of trusted to the data.
    model: int_claim_revert
    given:
      - input: ref('stg_reverts')
        rows:
          - {claim_id: "c1", revert_id: "r2", reverted_at: "2026-06-20 10:00:00", dq_reject_reason: null}
          - {claim_id: "c1", revert_id: "r1", reverted_at: "2026-06-15 08:00:00", dq_reject_reason: null}
    expect:
      rows:
        - {claim_id: "c1", revert_id: "r1", reverted_at: "2026-06-15 08:00:00", revert_event_count: 2}

  - name: revert_ignores_quarantined_reverts
    description: >
      An orphan reversal (pointing at a claim outside our universe) invalidates
      nothing. Applying it would be inventing a reversal.
    model: int_claim_revert
    given:
      - input: ref('stg_reverts')
        rows:
          - {claim_id: "c1", revert_id: "r1", reverted_at: "2026-06-15 08:00:00", dq_reject_reason: "orphan_claim_id"}
    expect:
      rows: []

  # ---------- NADAC cost resolution ----------

  - name: cost_uses_the_snapshot_in_force_on_the_fill_date
    description: >
      The decision the brief asks us to make and state. Three weekly snapshots
      for one NDC; a claim filled 2026-04-15 takes the 2026-04-01 price ($2.00),
      not the newest one ($3.00) and not the oldest ($1.00). Swap the ASOF JOIN
      for "latest available" and this test fails with a name that says why.
    model: int_claim_cost
    given:
      - input: ref('stg_claims')
        rows:
          - {claim_id: "c1", ndc: "00078050161", filled_date: "2026-04-15", quantity: 30, dq_reject_reason: null}
      - input: ref('stg_nadac')
        rows:
          - {ndc: "00078050161", effective_date: "2026-03-04", nadac_unit_cost_usd: 1.00, generic_unit_cost_usd: null, drug_class: "generic"}
          - {ndc: "00078050161", effective_date: "2026-04-01", nadac_unit_cost_usd: 2.00, generic_unit_cost_usd: null, drug_class: "generic"}
          - {ndc: "00078050161", effective_date: "2026-05-06", nadac_unit_cost_usd: 3.00, generic_unit_cost_usd: null, drug_class: "generic"}
    expect:
      rows:
        - {claim_id: "c1", unit_cost_usd: 2.00, cost_effective_date: "2026-04-01", cost_basis: "as_of_fill_date", est_acquisition_cost_cents: 6000, has_cost_match: true}

  - name: cost_falls_back_to_earliest_when_the_claim_predates_nadac
    description: >
      A claim filled before the first published price for its NDC. Rather than
      throwing the margin away we anchor on the oldest snapshot that exists, and
      `cost_basis` labels the row so a cost-sensitive analysis can exclude it
      instead of discovering it afterwards. This path fires zero times on the
      current sample — which is precisely why it can only be pinned here.
    model: int_claim_cost
    given:
      - input: ref('stg_claims')
        rows:
          - {claim_id: "c2", ndc: "00078050161", filled_date: "2026-02-01", quantity: 10, dq_reject_reason: null}
      - input: ref('stg_nadac')
        rows:
          - {ndc: "00078050161", effective_date: "2026-03-04", nadac_unit_cost_usd: 1.00, generic_unit_cost_usd: null, drug_class: "generic"}
          - {ndc: "00078050161", effective_date: "2026-04-01", nadac_unit_cost_usd: 2.00, generic_unit_cost_usd: null, drug_class: "generic"}
    expect:
      rows:
        - {claim_id: "c2", unit_cost_usd: 1.00, cost_effective_date: "2026-03-04", cost_basis: "earliest_available", est_acquisition_cost_cents: 1000, has_cost_match: true}

  - name: cost_is_unknown_not_zero_when_the_ndc_is_not_in_nadac
    description: >
      571 claims carry an NDC that NADAC never publishes. The cost comes out
      NULL, not 0 — a zero would read as "this drug is free" and quietly inflate
      pharmacy margin. `has_cost_match = false` is what lets fct_claim leave
      `pharmacy_margin_cents` NULL for these.
    model: int_claim_cost
    given:
      - input: ref('stg_claims')
        rows:
          - {claim_id: "c3", ndc: "99999000101", filled_date: "2026-04-15", quantity: 30, dq_reject_reason: null}
      - input: ref('stg_nadac')
        rows:
          - {ndc: "00078050161", effective_date: "2026-03-04", nadac_unit_cost_usd: 1.00, generic_unit_cost_usd: null, drug_class: "generic"}
    expect:
      rows:
        - {claim_id: "c3", unit_cost_usd: null, cost_effective_date: null, cost_basis: "no_match", est_acquisition_cost_cents: null, has_cost_match: false}

  - name: cost_multiplies_before_rounding_to_cents
    description: >
      The reason `nadac_unit_cost_usd` stays DOUBLE all the way here instead of
      becoming cents in staging. NADAC publishes five decimals: 0.26341 x 30 is
      $7.90 (790 cents). Round the unit rate to the cent first and you get 26 x
      30 = 780 — a 1.3% error on every claim, in our favour, invisible.
    model: int_claim_cost
    given:
      - input: ref('stg_claims')
        rows:
          - {claim_id: "c4", ndc: "00378335016", filled_date: "2026-05-01", quantity: 30, dq_reject_reason: null}
      - input: ref('stg_nadac')
        rows:
          - {ndc: "00378335016", effective_date: "2026-01-01", nadac_unit_cost_usd: 0.26341, generic_unit_cost_usd: null, drug_class: "generic"}
    expect:
      rows:
        - {claim_id: "c4", est_acquisition_cost_cents: 790, cost_basis: "as_of_fill_date"}
