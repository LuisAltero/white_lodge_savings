version: 2

models:
  - name: fct_claim
    description: >
      Grain: one valid claim. The central table. The net_* columns already net
      out reversals, so summing without a filter gives the right number.
    columns:
      - name: claim_id
        data_tests: [unique, not_null]
      - name: pharmacy_npi
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_pharmacy')
                field: pharmacy_npi
      - name: partner
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_partner')
                field: partner_name
      - name: ndc
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_drug')
                field: ndc
      - name: chain
        data_tests: [not_null]
      - name: filled_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: price_cents
        data_tests: [not_null]
      - name: is_reverted
        data_tests: [not_null]
      - name: net_wls_revenue_cents
        data_tests: [not_null]

  - name: fct_lookup
    description: "Grain: one price-lookup event."
    columns:
      - name: lookup_id
        data_tests: [unique, not_null]
      - name: partner
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_partner')
                field: partner_name
      - name: claim_id
        data_tests:
          - relationships:
              arguments:
                to: ref('fct_claim')
                field: claim_id

  - name: dim_pharmacy
    description: One row per pharmacy, current state.
    columns:
      - name: pharmacy_npi
        data_tests: [unique, not_null]
      - name: chain
        data_tests: [not_null]

  - name: dim_partner
    description: One row per partner, plus the synthetic 'direct' and 'unknown' members.
    columns:
      - name: partner_name
        data_tests: [unique, not_null]

  - name: dim_drug
    description: One row per NDC observed in our events, with NADAC attributes.
    columns:
      - name: ndc
        data_tests: [unique, not_null]

  - name: dim_date
    description: Calendar spine covering the event period.
    columns:
      - name: date_day
        data_tests: [unique, not_null]

  - name: dq_rejects
    description: Quarantined records, with the reason and the original payload.
    columns:
      - name: reject_reason
        data_tests: [not_null]

  - name: mart_partner_performance
    description: "Grain: one partner. Volume, retained revenue and funnel."
    columns:
      - name: partner
        data_tests: [unique, not_null]

  - name: mart_drug_economics
    description: "Grain: one NDC. Where the margin is and what erodes it."
    columns:
      - name: ndc
        data_tests: [unique, not_null]

  - name: mart_funnel_daily
    description: >
      Grain: day x partner x channel. Carries two reversal measures on two
      different dates — see the model header. `mart_partner_performance` and
      `mart_drug_economics` keep the plain name `reverted_claims` because they
      have no date grain, so there is nothing to confuse it with.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [date_day, partner, channel]
    columns:
      - name: claims_filled_then_reverted
        description: >
          Cohort measure, keyed on filled_date: of the claims filled this day,
          how many were ever reverted. Divides into cohort_reversal_rate.
        data_tests: [not_null]
      - name: reverts_on_day
        description: >
          Activity measure, keyed on reverted_at: reversals that actually
          happened this day. Answers "what did we hand back last week?".
        data_tests: [not_null]
      - name: revenue_reversed_cents
        description: >
          WLS revenue handed back on this day. Gross by construction — the net_*
          columns are already zeroed on a reverted row.
        data_tests: [not_null]
